[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "convolutional-coding-lab"
version = "1.0.0"
description = "Terminated convolutional coding and hard/soft Viterbi over synthetic AWGN"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
